<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    @keyframes pulseLine {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    .animated-line {
      stroke-dasharray: 20 10;
      animation: pulseLine 25s linear infinite;
    }

    .card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .glow-bg { animation: pulseGlow 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="80" r="120" fill="#38bdf8" class="glow-bg" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="270" r="140" fill="#c084fc" class="glow-bg" opacity="0.15" filter="url(#glow)" />

  <!-- Background Dynamic Network/Flow Lines (Behind Text) -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none">
    <path d="M 50 50 Q 300 150 600 50 T 1150 50" class="animated-line" />
    <path d="M 50 300 Q 400 180 800 300 T 1150 200" class="animated-line" />
  </g>

  <!-- Dynamic Floating Decorative Cards (Positioned safely away from text) -->
  <g class="card-1" transform="translate(920, 40)">
    <rect width="220" height="70" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="30" cy="35" r="14" fill="#0284c7" opacity="0.8" />
    <text x="30" y="40" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">✓</text>
    <text x="58" y="32" class="badge-text" font-size="13">Traceability Matrix</text>
    <text x="58" y="50" fill="#64748b" font-size="11" font-family="sans-serif">100% Verified</text>
  </g>

  <g class="card-2" transform="translate(950, 230)">
    <rect width="200" height="65" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="28" cy="32" r="12" fill="#6366f1" opacity="0.8" />
    <text x="28" y="37" text-anchor="middle" fill="#fff" font-size="12">⚙</text>
    <text x="50" y="30" class="badge-text" font-size="12">Requirements-as-Code</text>
    <text x="50" y="46" fill="#64748b" font-size="11" font-family="sans-serif">Git-native workflow</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Unobscured & Crystal Clear) -->
  <g transform="translate(60, 110)">
    <!-- Category Tag / Badge -->
    <rect width="260" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="130" y="20" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">SYSTEMS &amp; ALM ECOSYSTEM</text>
    
    <!-- Title -->
    <text x="0" y="80" class="title">Awesome Engineering Requirements Management</text>
    
    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle">A curated collection of SaaS platforms, ALM suites &amp; open-source requirements-as-code tools.</text>
    
    <!-- Tech Pills -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" />
      <text x="65" y="18" text-anchor="middle" class="badge-text">📊 SaaS Platforms</text>

      <rect x="142" y="0" width="160" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" />
      <text x="222" y="18" text-anchor="middle" class="badge-text">💻 Requirements-as-Code</text>

      <rect x="314" y="0" width="140" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" />
      <text x="384" y="18" text-anchor="middle" class="badge-text">🔗 ALM &amp; Traceability</text>
    </g>
  </g>
</svg>
